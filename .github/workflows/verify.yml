name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/validate-card-exercises.cjs examples/cards.json examples/mutants.json /tmp/validation.json
      - run: npm run test:desktop
      - run: npm run audit:release
