name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to verify for release
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git rev-parse HEAD && xcodebuild -version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
      # Built-in Node modules only: fail before installing dependencies or
      # running the app or tests if private files reached this checkout/history.
      - run: npm run audit:release
      - run: npm run setup -- --no-launch
      - run: npm run docs:check
      - run: npm run release:ipad:check
      - run: npm run build:pad-helper
      - run: swift test --package-path native/mac-handoff
      - run: swift test --package-path apps/ipad
      - run: npm run build:ipad
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run test:security:native
      - run: npm run test:security:desktop
      - run: node scripts/validate-card-exercises.cjs examples/cards.json examples/mutants.json /tmp/validation.json
      - run: npm run test:desktop
      - run: npm run test:visuals
      - run: node scripts/smoke-self-test.cjs
      - run: npm run test:links
      - run: npm run test:live-imports
      - run: npm run test:progress
      - run: npm run test:connections
      - run: npm run test:updates
      - run: node scripts/smoke-knowledge-setup.cjs
      - run: npm run test:knowledge-bootstrap
      - run: npm run test:knowledge-space
      - run: npm run test:constellation
      - run: npm run test:voice
      - run: npm run test:speak
      - run: npm run test:handwriting
      - run: npm run test:tutor-workspace
      - run: npm run test:paper-learning
      - run: npm run test:notebooks
      - run: npm run test:pad-lifecycle
      - run: npm run package
      - run: npm run audit:package
      - run: npm run test:updates
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:visuals
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:desktop
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:progress
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:live-imports
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: node scripts/smoke-packaged-connections.cjs
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:connections
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: node scripts/smoke-knowledge-setup.cjs
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:knowledge-bootstrap
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:knowledge-space
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:constellation
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:security:desktop
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:voice
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:speak
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:handwriting
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:tutor-workspace
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:paper-learning
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:notebooks
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
      - run: npm run test:pad-lifecycle
        env:
          RECALL_TEST_EXECUTABLE: release/Recall-darwin-arm64/Recall.app/Contents/MacOS/Recall
