<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Recall architecture</title><desc id="desc">Optional assistant skills and ordinary local notes connect to the Recall Mac app. The app manages a learning inbox, Knowledge space and practice, with SQLite and FSRS. Optional Recall Pad pairs locally; optional OpenAI requests provide transcription and feedback.</desc><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#839b88" opacity=".16"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#839b88" stroke-width="2"/></marker><marker id="arrowstart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M7 1 L2 4 L7 7" fill="none" stroke="#839b88" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#f5f2e9"/><rect width="100%" height="100%" fill="url(#dots)"/><text x="80" y="70" fill="#243d34" font-family="Georgia, serif" font-size="40" font-weight="400" font-style="italic">r.</text><text x="123" y="68" fill="#243d34" font-family="Arial, sans-serif" font-size="30" font-weight="700" >recall</text><text x="1500" y="66" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" letter-spacing="2">YOUR KNOWLEDGE, KEPT.</text><text x="80" y="160" fill="#243d34" font-family="Georgia, serif" font-size="59" font-weight="400" >One local home for your learning.</text><text x="80" y="211" fill="#68776c" font-family="Arial, sans-serif" font-size="27" font-weight="400" >Ordinary files. A searchable knowledge space. Practice that comes back.</text><rect x="480" y="270" width="640" height="650" rx="24" fill="#243d34" stroke="none" /><text x="520" y="330" fill="#fffdf6" font-family="Georgia, serif" font-size="41" font-weight="400" >Recall on your Mac</text><text x="520" y="371" fill="#cfddd1" font-family="Arial, sans-serif" font-size="25" font-weight="400" >Electron + React</text><rect x="510" y="405" width="580" height="125" rx="18" fill="#fbfaf5" stroke="none" /><rect x="530" y="430" width="6" height="73" rx="3" fill="#dfe8d7" stroke="none" /><text x="556" y="453" fill="#243d34" font-family="Georgia, serif" font-size="31" font-weight="400" >Learning inbox</text><text x="556" y="493" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Reuse ready cards; prepare missing ones.</text><rect x="510" y="555" width="580" height="125" rx="18" fill="#fbfaf5" stroke="none" /><rect x="530" y="580" width="6" height="73" rx="3" fill="#dfe9ef" stroke="none" /><text x="556" y="603" fill="#243d34" font-family="Georgia, serif" font-size="31" font-weight="400" >Knowledge space</text><text x="556" y="643" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Background search index · SQLite FTS5</text><rect x="510" y="705" width="580" height="125" rx="18" fill="#fbfaf5" stroke="none" /><rect x="530" y="730" width="6" height="73" rx="3" fill="#f2e0cf" stroke="none" /><text x="556" y="753" fill="#243d34" font-family="Georgia, serif" font-size="31" font-weight="400" >Practice &amp; review</text><text x="556" y="793" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Concepts · Math · Coding · Speak</text><text x="800" y="879" fill="#e6ede4" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle">SQLite history · FSRS scheduling</text><rect x="60" y="295" width="340" height="220" rx="24" fill="white" stroke="#d8ddd0" /><rect x="84" y="319" width="292" height="35" rx="9" fill="#dfe8d7" stroke="none" /><text x="100" y="343" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">OPTIONAL</text><text x="84" y="402" fill="#243d34" font-family="Georgia, serif" font-size="32" font-weight="400" >Assistant skills</text><text x="84" y="446" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Codex · Claude Code</text><text x="84" y="477" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Notion via your assistant</text><rect x="60" y="615" width="340" height="240" rx="24" fill="white" stroke="#d8ddd0" /><rect x="84" y="639" width="292" height="35" rx="9" fill="#dfe9ef" stroke="none" /><text x="100" y="663" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ON YOUR DEVICE</text><text x="84" y="722" fill="#243d34" font-family="Georgia, serif" font-size="32" font-weight="400" >Your note files</text><text x="84" y="766" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Markdown · HTML</text><text x="84" y="797" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Obsidian can use</text><text x="84" y="828" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >the same folder.</text><rect x="1200" y="295" width="340" height="220" rx="24" fill="white" stroke="#d8ddd0" /><rect x="1224" y="319" width="292" height="35" rx="9" fill="#f2e0cf" stroke="none" /><text x="1240" y="343" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">OPTIONAL</text><text x="1224" y="402" fill="#243d34" font-family="Georgia, serif" font-size="32" font-weight="400" >Recall Pad</text><text x="1224" y="446" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >SwiftUI + PencilKit</text><text x="1224" y="477" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Handwriting + notebooks</text><rect x="1200" y="615" width="340" height="240" rx="24" fill="white" stroke="#d8ddd0" /><rect x="1224" y="639" width="292" height="35" rx="9" fill="#e7e2ec" stroke="none" /><text x="1240" y="663" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">OPTIONAL</text><text x="1224" y="722" fill="#243d34" font-family="Georgia, serif" font-size="32" font-weight="400" >OpenAI API</text><text x="1224" y="766" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Selected audio, pages</text><text x="1224" y="797" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >and reference context</text><text x="1224" y="828" fill="#68776c" font-family="Arial, sans-serif" font-size="22" font-weight="400" >Transcription + feedback</text><path d="M410 405 H468" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"  /><text x="440" y="383" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">capture</text><path d="M410 725 H468" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrowstart)" /><text x="440" y="703" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">files</text><path d="M1132 405 H1188" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrowstart)" /><text x="1160" y="383" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">local</text><path d="M1132 725 H1188" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrowstart)" /><text x="1160" y="703" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">request</text><text x="800" y="1001" fill="#243d34" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="middle">Your library lives locally. You choose what to send.</text><text x="800" y="1053" fill="#68776c" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">No hosted Recall database · Notes remain ordinary files · AI services are optional</text></svg>