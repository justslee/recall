<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">From an AI conversation to something you can recall</title><desc id="desc">Explore a concept, capture a useful objective, practice with a suitable question, and revisit it. Your review rating guides future reviews.</desc><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#839b88" opacity=".16"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#839b88" stroke-width="2"/></marker><marker id="arrowstart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M7 1 L2 4 L7 7" fill="none" stroke="#839b88" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#f5f2e9"/><rect width="100%" height="100%" fill="url(#dots)"/><text x="80" y="70" fill="#243d34" font-family="Georgia, serif" font-size="40" font-weight="400" font-style="italic">r.</text><text x="123" y="68" fill="#243d34" font-family="Arial, sans-serif" font-size="30" font-weight="700" >recall</text><text x="1500" y="66" fill="#68776c" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" letter-spacing="2">YOUR KNOWLEDGE, KEPT.</text><text x="80" y="166" fill="#243d34" font-family="Georgia, serif" font-size="58" font-weight="400" >Let understanding catch up with output.</text><text x="80" y="218" fill="#68776c" font-family="Arial, sans-serif" font-size="28" font-weight="400" >A small learning loop, woven into the work you already do.</text><rect x="84" y="304" width="320" height="320" rx="24" fill="#d9ddcf" stroke="none" opacity=".45"/><rect x="80" y="296" width="320" height="320" rx="24" fill="white" stroke="#d8ddd0" /><rect x="108" y="324" width="60" height="52" rx="15" fill="#dfe8d7" stroke="none" /><text x="138" y="358" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">01</text><text x="108" y="430" fill="#243d34" font-family="Georgia, serif" font-size="40" font-weight="400" >Explore</text><text x="108" y="480" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Ask a question.</text><text x="108" y="513" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Read. Build. Discuss.</text><path d="M108 544 H372" fill="none" stroke="#d8ddd0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"   /><text x="108" y="580" fill="#68776c" font-family="Arial, sans-serif" font-size="20" font-weight="400" >Learning starts here</text><path d="M408 456 H431" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"  /><rect x="444" y="304" width="320" height="320" rx="24" fill="#d9ddcf" stroke="none" opacity=".45"/><rect x="440" y="296" width="320" height="320" rx="24" fill="white" stroke="#d8ddd0" /><rect x="468" y="324" width="60" height="52" rx="15" fill="#dfe9ef" stroke="none" /><text x="498" y="358" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">02</text><text x="468" y="430" fill="#243d34" font-family="Georgia, serif" font-size="40" font-weight="400" >Capture</text><text x="468" y="480" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Keep the useful idea.</text><text x="468" y="513" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Reuse or prepare a card.</text><path d="M468 544 H732" fill="none" stroke="#d8ddd0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"   /><text x="468" y="580" fill="#68776c" font-family="Arial, sans-serif" font-size="20" font-weight="400" >Opt-in local inbox</text><path d="M768 456 H791" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"  /><rect x="804" y="304" width="320" height="320" rx="24" fill="#d9ddcf" stroke="none" opacity=".45"/><rect x="800" y="296" width="320" height="320" rx="24" fill="white" stroke="#d8ddd0" /><rect x="828" y="324" width="60" height="52" rx="15" fill="#f2e0cf" stroke="none" /><text x="858" y="358" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">03</text><text x="828" y="430" fill="#243d34" font-family="Georgia, serif" font-size="40" font-weight="400" >Practice</text><text x="828" y="480" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Explain, solve or code.</text><text x="828" y="513" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Use what fits the idea.</text><path d="M828 544 H1092" fill="none" stroke="#d8ddd0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"   /><text x="828" y="580" fill="#68776c" font-family="Arial, sans-serif" font-size="20" font-weight="400" >Your attempt comes first</text><path d="M1128 456 H1151" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"  /><rect x="1164" y="304" width="320" height="320" rx="24" fill="#d9ddcf" stroke="none" opacity=".45"/><rect x="1160" y="296" width="320" height="320" rx="24" fill="white" stroke="#d8ddd0" /><rect x="1188" y="324" width="60" height="52" rx="15" fill="#e7e2ec" stroke="none" /><text x="1218" y="358" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">04</text><text x="1188" y="430" fill="#243d34" font-family="Georgia, serif" font-size="40" font-weight="400" >Revisit</text><text x="1188" y="480" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Notice the gaps.</text><text x="1188" y="513" fill="#243d34" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Try again over time.</text><path d="M1188 544 H1452" fill="none" stroke="#d8ddd0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"   /><text x="1188" y="580" fill="#68776c" font-family="Arial, sans-serif" font-size="20" font-weight="400" >Your rating guides review</text><path d="M1320 630 V654 Q1320 680 1294 680 H986 Q960 680 960 654 V630" fill="none" stroke="#839b88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"  /><text x="1140" y="721" fill="#68776c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Come back to what needs practice.</text><rect x="80" y="786" width="1440" height="108" rx="24" fill="#243d34" stroke="none" /><text x="116" y="832" fill="#fffdf6" font-family="Georgia, serif" font-size="30" font-weight="400" >Reading is the beginning.</text><text x="116" y="870" fill="#cfddd1" font-family="Arial, sans-serif" font-size="24" font-weight="400" >The next step is finding out what you can use without looking.</text><text x="1485" y="850" fill="#cfddd1" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" letter-spacing="2">LOCAL FIRST</text></svg>